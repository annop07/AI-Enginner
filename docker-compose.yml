# Optional: run Qdrant as a real server instead of embedded file mode.
#   docker compose up -d
# Then set QDRANT_LOCATION=http://localhost:6333 in your .env
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
